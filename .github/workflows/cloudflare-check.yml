name: Cloudflare checks
on:
  push:
    paths: ['cloudflare/**', '.github/workflows/cloudflare-check.yml']
  pull_request:
    paths: ['cloudflare/**', '.github/workflows/cloudflare-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir .wrangler/check
        env:
          WRANGLER_SEND_METRICS: 'false'
